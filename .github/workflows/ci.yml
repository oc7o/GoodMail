name: CI

on:
  push:
    branches: [main]
  pull_request:

# Xcode 27 images are labelled by Xcode version, not by macOS version.
jobs:
  test-packages:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test GoodMailKit
        working-directory: GoodMailKit
        run: swift test --disable-keychain

  build-app:
    runs-on: xcode-27
    strategy:
      matrix:
        destination: ["platform=macOS", "generic/platform=iOS"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: >
          xcodebuild -project GoodMail.xcodeproj -scheme GoodMail
          -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO build
