name: GoodMail
options:
  bundleIdPrefix: dev.goodmail
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GoodMailKit:
    path: GoodMailKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GoodMail:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: GoodMailKit
        product: JMAPKit
      - package: GoodMailKit
        product: MailPrivacy
      - package: GoodMailKit
        product: MailStore
      - package: GoodMailKit
        product: GoodMailCore
      - package: GoodMailKit
        product: DemoAccount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.goodmail.GoodMail
        PRODUCT_NAME: GoodMail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GoodMail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
        # The embedded SQLCipher framework lives in Contents/Frameworks on the Mac.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
